services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fooddrop
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: fooddrop
    ports:
      - "5433:5432"
    volumes:
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
